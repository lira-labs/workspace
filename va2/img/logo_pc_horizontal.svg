<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 140" width="100%" height="100%">
  <defs>
    <linearGradient id="edgeGradPC" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#002FA7" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <radialGradient id="pulseGradPC" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.0" />
    </radialGradient>
  </defs>

  <!-- SÍMBOLO GRAFO EXPANSIVO -->
  <g id="symbol">
    <path d="M 40 88 Q 54 48, 76 44 T 112 80" 
          fill="none" 
          stroke="url(#edgeGradPC)" 
          stroke-width="6" 
          stroke-linecap="round" />
    <circle cx="76" cy="44" r="26" fill="url(#pulseGradPC)" />
    <circle cx="40" cy="88" r="12" fill="#002FA7" />
    <circle cx="40" cy="88" r="5" fill="#ffffff" />
    <circle cx="112" cy="80" r="10" fill="#002FA7" />
    <circle cx="112" cy="80" r="4" fill="#ffffff" />
    <circle cx="76" cy="44" r="17" fill="#059669" />
    <circle cx="76" cy="44" r="7" fill="#ffffff" />
  </g>

  <!-- LOGOTIPO & SLOGAN DESKTOP -->
  <g id="wordmark" transform="translate(142, 0)">
    <text y="72" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
      <tspan font-size="42" font-weight="400" fill="#0f172a">Grafo</tspan>
      <tspan dx="4" font-size="42" font-weight="800" fill="#002FA7">Parada</tspan>
    </text>
    <text y="100" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
          font-size="11" 
          font-weight="700" 
          letter-spacing="0.22em" 
          fill="#64748b">
      MENOS ESPERA · MAIS CIDADE
    </text>
  </g>
</svg>
