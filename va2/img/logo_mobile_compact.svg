<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <defs>
    <linearGradient id="edgeGradM" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#002FA7" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <radialGradient id="pulseGradM" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.0" />
    </radialGradient>
  </defs>

  <!-- SÍMBOLO COMPACTO MOBILE -->
  <g id="symbol">
    <path d="M 24 50 Q 34 26, 48 24 T 72 46" 
          fill="none" 
          stroke="url(#edgeGradM)" 
          stroke-width="4.5" 
          stroke-linecap="round" />
    <circle cx="48" cy="24" r="16" fill="url(#pulseGradM)" />
    <circle cx="24" cy="50" r="7.5" fill="#002FA7" />
    <circle cx="24" cy="50" r="3" fill="#ffffff" />
    <circle cx="72" cy="46" r="6" fill="#002FA7" />
    <circle cx="72" cy="46" r="2.5" fill="#ffffff" />
    <circle cx="48" cy="24" r="11" fill="#059669" />
    <circle cx="48" cy="24" r="4.5" fill="#ffffff" />
  </g>

  <!-- TIPOGRAFIA MOBILE COMPACTA -->
  <g id="wordmark" transform="translate(92, 0)">
    <text y="42" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
      <tspan font-size="28" font-weight="400" fill="#0f172a">Grafo</tspan>
      <tspan dx="2" font-size="28" font-weight="800" fill="#002FA7">Parada</tspan>
    </text>
    <text y="58" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
          font-size="8.5" 
          font-weight="700" 
          letter-spacing="0.14em" 
          fill="#64748b">
      GRANDE RECIFE · IA PREDITIVA
    </text>
  </g>
</svg>
