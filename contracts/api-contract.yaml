openapi: 3.0.3
info:
  title: GrafoParada & Real Transit Engine API
  description: >
    Contrato formal compartilhado de dados e serviços do GrafoParada.
    Sincronização rígida entre a Central de Despacho Operacional (Backend/ST-GCN/CTM),
    os algoritmos de predição comportamental e percepção temporal,
    e as interfaces do passageiro (Frontend Mobile/PWA/Laya IA).
    Fundamentado na literatura A1: Kim et al. (2026), Yap & Cats (2021) e Tan & Ramli (2024).
  version: 2.2.0

paths:
  /api/v1/network/gtfs:
    get:
      summary: Catálogo Metropolitano GTFS CTM
      description: Retorna a malha completa de linhas, paradas e traçados georreferenciados.
      responses:
        '200':
          description: Malha metropolitana carregada com sucesso.
          content:
            application/json:
              schema:
                type: object
                required:
                  - total_routes
                  - routes
                properties:
                  total_routes:
                    type: integer
                    example: 393
                  routes:
                    type: array
                    items:
                      $ref: '#/components/schemas/Route'

  /api/v1/telemetry/line/{route_code}:
    get:
      summary: Telemetria ao Vivo de Corredor
      description: Retorna a telemetria espacial e estado operacional em tempo real de uma linha.
      parameters:
        - name: route_code
          in: path
          required: true
          schema:
            type: string
            example: "199"
      responses:
        '200':
          description: Telemetria espacial em tempo real do corredor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LineTelemetry'
        '404':
          description: Linha não encontrada no catálogo metropolitano.

  /api/v1/predict/corridor:
    post:
      summary: Predição Espaço-Temporal ST-GCN & Risco de Abandono
      description: >
        Calcula os horizontes multi-passo de espera (T+10, T+20, T+30),
        o tempo percebido psicológico (1.68x Yap & Cats 2021), a probabilidade
        de passenger reneging (Kim et al. 2026) e o estado da Trava Híbrida Defensiva.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - route_code
                - corridor_id
              properties:
                route_code:
                  type: string
                  example: "199"
                corridor_id:
                  type: string
                  example: "pe60_camela_cabo"
      responses:
        '200':
          description: Predições calculadas com sucesso.
          content:
            application/json:
              schema:
                type: object
                required:
                  - route_code
                  - corridor_id
                  - stops_prediction
                properties:
                  route_code:
                    type: string
                    example: "199"
                  corridor_id:
                    type: string
                    example: "pe60_camela_cabo"
                  stops_prediction:
                    type: array
                    items:
                      $ref: '#/components/schemas/PredictedStopInfo'

  /api/v1/dispatch/emergency:
    post:
      summary: Notificação de Despacho Operacional CTM
      description: >
        Dispara inserção de veículo no contra-fluxo para resgate de passageiros
        e mitigação de deadheading quando o risco de abandono for crítico.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmergencyDispatchPayload'
      responses:
        '200':
          description: Despacho confirmado e registrado na malha.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmergencyDispatchResult'

  /api/v1/system/deck-status:
    get:
      summary: Auditoria Física do Deck de Apresentação da Banca
      description: Garante que o artefato oficial PowerPoint esteja preservado e integro para visualização e avaliação docente.
      responses:
        '200':
          description: Metadados do artefato de apresentação oficial.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresentationDeckStatus'

  /api/tts:
    get:
      summary: Status de Disponibilidade do Proxy Neural TTS
      description: >
        Verifica sem gerar erro HTTP >= 400 se `GEMINI_API_KEY` está ativa no ambiente Vercel,
        permitindo degradação imediata para Web Speech API sem ruído no console do navegador.
      responses:
        '200':
          description: Estado atual do proxy TTS.
          content:
            application/json:
              schema:
                type: object
                required:
                  - available
                  - fallback
                  - reason
                properties:
                  available:
                    type: boolean
                    example: false
                  fallback:
                    type: string
                    enum: [web_speech]
                  reason:
                    type: string
                    example: "missing_api_key"
                  presets:
                    type: array
                    items:
                      type: string
    post:
      summary: Síntese de Voz Neural da Laya (Proxy Gemini TTS)
      description: >
        Proxy serverless Vercel para síntese de voz contextual em português brasileiro da assistente Laya
        via Gemini TTS, mantendo `GEMINI_API_KEY` estritamente no servidor.
        Retorna `audio/wav` em caso de sucesso ou JSON explícito de fallback (`501`/`503`) para degradação
        graciosa via Web Speech API offline/local quando a chave não estiver configurada ou houver cota/429.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TTSSynthesisRequest'
      responses:
        '200':
          description: Áudio WAV sintetizado com sucesso via Gemini TTS.
          headers:
            X-Laya-TTS-Provider:
              description: Identificador do provedor e modelo utilizados na síntese.
              schema:
                type: string
                example: "gemini-3.8-flash-lite-tts"
            X-Laya-TTS-Voice:
              description: Identificador da voz utilizada na síntese.
              schema:
                type: string
                example: "pt-br-assistant-6"
          content:
            audio/wav:
              schema:
                type: string
                format: binary
        '400':
          description: Payload inválido (texto ausente, acima de 600 caracteres ou preset/tom inválido).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TTSFallbackResponse'
        '501':
          description: GEMINI_API_KEY não configurada no ambiente Vercel; frontend deve usar fallback Web Speech API.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TTSFallbackResponse'
              example:
                fallback: "web_speech"
                reason: "missing_api_key"
        '503':
          description: Upstream Gemini TTS indisponível, timeout ou cota/429 atingida; frontend deve usar fallback Web Speech API.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TTSFallbackResponse'
              example:
                fallback: "web_speech"
                reason: "upstream_unavailable"

  /api/register:
    get:
      summary: Consulta Cadastro LGPD e Disponibilidade de Persistência
      description: >
        Retorna disponibilidade do banco Neon Postgres ou degradação graciosa para
        armazenamento local (`client_local`). Quando `user_id` é fornecido e o banco está ativo,
        retorna o perfil cadastrado sem expor dados sensíveis ou CPF.
      parameters:
        - name: user_id
          in: query
          required: false
          schema:
            type: string
            example: "usr_a1b2c3d4e5f6"
      responses:
        '200':
          description: Estado da persistência e perfil opcional do usuário.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
    post:
      summary: Cadastro / Atualização de Perfil LGPD do Passageiro
      description: >
        Registra ou atualiza perfil leve do passageiro (`users`) sem exigir CPF.
        Persiste no Neon Postgres quando `DATABASE_URL` está configurado (200/201) ou
        retorna 202 com fallback `client_local_pending_db`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
      responses:
        '200':
          description: Perfil atualizado no Neon Postgres.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '201':
          description: Perfil criado no Neon Postgres.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '202':
          description: Payload validado; aguardando provisionamento de `DATABASE_URL` (armazenamento local no cliente).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '400':
          description: "Payload inválido (ex.: nome ausente ou fora do tamanho permitido)."

  /api/routine:
    get:
      summary: Consulta Rotinas Pendulares Persistidas
      description: >
        Lista rotinas salvas para `user_id` no Neon Postgres ou informa degradação
        para armazenamento local (`client_local`) sem gerar HTTP 500.
      parameters:
        - name: user_id
          in: query
          required: false
          schema:
            type: string
            example: "usr_a1b2c3d4e5f6"
      responses:
        '200':
          description: Lista de rotinas ou estado de armazenamento local.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutinePersistResponse'
    post:
      summary: Salva Rotina Diária de Origem e Destino do Passageiro
      description: >
        Persiste a rotina (`routines`) com paradas de origem/destino, horários e linha preferencial
        para personalização da Laya IA e agregação de demanda para treino da ST-GCN.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoutinePersistRequest'
      responses:
        '200':
          description: Rotina atualizada no Neon Postgres.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutinePersistResponse'
        '201':
          description: Rotina criada no Neon Postgres.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutinePersistResponse'
        '202':
          description: Payload validado; persistido localmente no cliente enquanto `DATABASE_URL` não está configurada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutinePersistResponse'
        '400':
          description: Payload inválido (campos obrigatórios de origem/destino ou `user_id` ausentes).

  /api/telemetry:
    get:
      summary: Status do Banco, Telemetria Coletada e Histórico de Treinos ST-GCN
      description: >
        Retorna contagens das 4 tabelas (`users`, `routines`, `demand_observations`, `training_runs`),
        últimas observações reais e métricas do ciclo mais recente da ST-GCN.
      parameters:
        - name: route_code
          in: query
          required: false
          schema:
            type: string
            example: "199"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Estado consolidado do banco de dados e histórico de treinos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseStatusAndTrainingResponse'
    post:
      summary: Registra Observação Real de Espera e Demanda (`demand_observations`)
      description: >
        Persiste observação de campo do passageiro ou telemetria associada para alimentação contínua
        do `transit-trainer` (`treinar_modelo_continuo.py`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemandObservationRequest'
      responses:
        '200':
          description: Observação registrada no Neon Postgres.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseStatusAndTrainingResponse'
        '201':
          description: Observação criada no Neon Postgres.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseStatusAndTrainingResponse'
        '202':
          description: Observação validada e mantida localmente no cliente (`client_local_pending_db`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseStatusAndTrainingResponse'
        '400':
          description: Payload inválido (`route_code` ou `source` ausente, ou métricas fora de faixa).

components:
  schemas:
    Route:
      type: object
      required:
        - route_code
        - route_label
        - agency
        - corridor_id
      properties:
        route_code:
          type: string
          example: "199"
        route_label:
          type: string
          example: "199 - Camela / TI Cabo"
        agency:
          type: string
          example: "São Judas Tadeu (SJT) · CTM Grande Recife"
        direction:
          type: string
          enum: [IDA, VOLTA]
          example: "VOLTA"
        corridor_id:
          type: string
          example: "pe60_camela_cabo"
        shape_id:
          type: string
          example: "199-392-2"
        stops_count:
          type: integer
          example: 64
        active:
          type: boolean
          example: true

    LineTelemetry:
      type: object
      required:
        - route_code
        - corridor_id
        - stops
      properties:
        route_code:
          type: string
          example: "199"
        corridor_id:
          type: string
          example: "pe60_camela_cabo"
        shape_id:
          type: string
          example: "199-392-2"
        stops:
          type: array
          items:
            $ref: '#/components/schemas/Stop'

    Stop:
      type: object
      required:
        - stop_id
        - name
        - lat
        - lon
        - wait_gps_min
      properties:
        stop_id:
          type: string
          example: "030613"
        name:
          type: string
          example: "Praça Pedro Serafim (Terminal de Camela)"
        lat:
          type: number
          format: double
          example: -8.514888
        lon:
          type: number
          format: double
          example: -35.123539
        wait_gps_min:
          type: number
          format: float
          example: 12.5
        stgcn_horizon_min:
          type: array
          items:
            type: number
          example: [12.0, 18.5, 24.0]
        perceived_wait_min:
          type: number
          format: float
          description: Tempo ponderado pelo multiplicador 1.68x de Yap & Cats (2021) sob queima ou superlotação.
          example: 21.0
        reneging_risk_pct:
          type: number
          format: float
          description: Probabilidade estimada de abandono de espera segundo Kim et al. (2026).
          example: 78.4
        crowd_level:
          type: integer
          minimum: 1
          maximum: 4
          example: 2
        crowd_status:
          type: string
          example: "🟢 Sentado Garantido"
        latent_demand_est:
          type: number
          example: 41.0
        latent_demand_ci:
          type: array
          items:
            type: number
          example: [37.0, 45.0]
        operational_state:
          type: string
          enum: [REGULAR, WARNING, CRITICAL]
          example: "REGULAR"
        emergency_lock:
          type: boolean
          description: Trava híbrida anti-oversmoothing acionada (|STGCN - GPS| > 15 min).
          example: false
        discrepancy_delta:
          type: number
          format: float
          example: 0.5

    PredictedStopInfo:
      type: object
      required:
        - stop_id
        - wait_gps_min
        - stgcn_horizon_min
        - perceived_wait_min
        - reneging_risk_pct
        - emergency_lock
      properties:
        stop_id:
          type: string
          example: "030613"
        wait_gps_min:
          type: number
          example: 14.0
        stgcn_horizon_min:
          type: array
          items:
            type: number
          example: [14.0, 22.0, 31.0]
        perceived_wait_min:
          type: number
          example: 23.52
        reneging_risk_pct:
          type: number
          example: 88.5
        emergency_lock:
          type: boolean
          example: false
        discrepancy_delta:
          type: number
          example: 1.2
        mitigation_action:
          type: string
          enum: [NONE, MONITOR, DEADHEADING_DISPATCH, EMERGENCY_LOCK_APPLIED]
          example: "NONE"

    EmergencyDispatchPayload:
      type: object
      required:
        - route_code
        - trigger_stop_id
        - reason
        - reneging_probability
      properties:
        route_code:
          type: string
          example: "199"
        trigger_stop_id:
          type: string
          example: "030613"
        reason:
          type: string
          example: "Retenção crítica > 15 min na PE-60 (Risco de Reneging Kim et al. 2026)"
        reneging_probability:
          type: number
          format: float
          example: 0.984
        perceived_wait_min:
          type: number
          format: float
          example: 25.2
        discrepancy_delta:
          type: number
          format: float
          example: 28.0
        action_type:
          type: string
          enum: [DEADHEADING_DISPATCH, EXTRA_BOARDING, TRAVA_DEFENSIVA_FALLBACK]
          example: "DEADHEADING_DISPATCH"

    EmergencyDispatchResult:
      type: object
      required:
        - dispatch_id
        - status
        - message
        - diesel_saved_liters
      properties:
        dispatch_id:
          type: string
          example: "DSP-2026-11-098"
        status:
          type: string
          enum: [EXECUTED, QUEUED, REJECTED]
          example: "EXECUTED"
        message:
          type: string
          example: "Veículo de contra-fluxo remanejado com sucesso para a PE-60."
        diesel_saved_liters:
          type: number
          example: 14.0
        timestamp:
          type: string
          format: date-time
          example: "2026-11-12T03:45:00Z"

    PresentationDeckStatus:
      type: object
      required:
        - file_name
        - exists
        - size_bytes
        - is_valid_deck
      properties:
        file_name:
          type: string
          example: "GrafoParada_Seminario2_CauaLira.pptx"
        exists:
          type: boolean
          example: true
        size_bytes:
          type: integer
          example: 13112877
        is_valid_deck:
          type: boolean
          example: true
        aspect_ratio:
          type: string
          example: "16:9"
        path:
          type: string
          example: "code/grafoparada_web/GrafoParada_Seminario2_CauaLira.pptx"

    TTSSynthesisRequest:
      type: object
      required:
        - text
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 600
          description: Texto em português brasileiro a ser sintetizado pela Laya (máximo de 600 caracteres).
          example: "Boa notícia: a linha cento e noventa e nove está chegando em uns três minutinhos."
        voice_preset:
          type: string
          enum: [ptbr_warm, sulafat_expressive, vindemiatrix_calm]
          default: ptbr_warm
          description: >
            Preset vocal da Laya:
            - ptbr_warm: gemini-3.8-flash-lite-tts / pt-br-assistant-6
            - sulafat_expressive: gemini-3.8-flash-tts / Sulafat
            - vindemiatrix_calm: gemini-3.8-flash-tts / Vindemiatrix
          example: "ptbr_warm"
        tone:
          type: string
          enum: [info, arriving, alert, cheerful]
          default: info
          description: Direção prosódica contextual da fala da Laya.
          example: "info"

    TTSFallbackResponse:
      type: object
      required:
        - fallback
        - reason
      properties:
        fallback:
          type: string
          enum: [web_speech]
          example: "web_speech"
        reason:
          type: string
          description: Motivo estruturado para ativação silenciosa do fallback local/Web Speech.
          example: "missing_api_key"

    UserRegistrationRequest:
      type: object
      required:
        - name
      properties:
        user_id:
          type: string
          description: Identificador pseudonimizado opcional para atualização idempotente.
          example: "usr_a1b2c3d4e5f6"
        name:
          type: string
          minLength: 2
          maxLength: 120
          description: Nome ou apelido de tratamento do passageiro (sem exigência de CPF).
          example: "Cauã Lira"
        contact_hint:
          type: string
          maxLength: 120
          description: Dica opcional de contato (ex. final do telefone ou e-mail mascarado).
          example: "whatsapp ****-1234"

    UserProfileResponse:
      type: object
      required:
        - available
        - storage
      properties:
        ok:
          type: boolean
          example: true
        available:
          type: boolean
          example: false
        db_configured:
          type: boolean
          example: false
        persisted:
          type: string
          enum: [neon_postgres, client_local_pending_db]
          example: "client_local_pending_db"
        storage:
          type: string
          enum: [neon_postgres, client_local]
          example: "client_local"
        reason:
          type: string
          example: "missing_database_url"
        record:
          type: object
          nullable: true
          properties:
            id:
              type: string
            name:
              type: string
            contact_hint:
              type: string
              nullable: true
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
        user:
          type: object
          nullable: true
          description: Perfil consultado no Neon Postgres quando `user_id` é informado.

    RoutinePersistRequest:
      type: object
      required:
        - user_id
        - origin_city
        - origin_stop_name
        - dest_city
        - dest_stop_name
      properties:
        id:
          type: string
          example: "rtn_a1b2c3d4e5f6"
        user_id:
          type: string
          example: "usr_a1b2c3d4e5f6"
        origin_city:
          type: string
          example: "Ipojuca"
        origin_neighborhood:
          type: string
          example: "Camela"
        origin_stop_id:
          type: string
          example: "030613"
        origin_stop_name:
          type: string
          example: "Praça Pedro Serafim (Terminal de Camela)"
        origin_lat:
          type: number
          format: double
          example: -8.514888
        origin_lon:
          type: number
          format: double
          example: -35.123539
        dest_city:
          type: string
          example: "Cabo de Santo Agostinho"
        dest_neighborhood:
          type: string
          example: "Centro"
        dest_stop_id:
          type: string
          example: "030001"
        dest_stop_name:
          type: string
          example: "Terminal Integrado do Cabo"
        dest_lat:
          type: number
          format: double
          example: -8.2869
        dest_lon:
          type: number
          format: double
          example: -35.0355
        departure_time:
          type: string
          example: "06:30"
        return_time:
          type: string
          example: "17:45"
        preferred_line:
          type: string
          example: "199"
        frequency:
          type: string
          example: "DUT"

    RoutinePersistResponse:
      type: object
      required:
        - available
        - storage
      properties:
        ok:
          type: boolean
          example: true
        available:
          type: boolean
          example: false
        db_configured:
          type: boolean
          example: false
        persisted:
          type: string
          enum: [neon_postgres, client_local_pending_db]
          example: "client_local_pending_db"
        storage:
          type: string
          enum: [neon_postgres, client_local]
          example: "client_local"
        reason:
          type: string
          example: "missing_database_url"
        record:
          type: object
          nullable: true
        routines:
          type: array
          items:
            type: object

    DemandObservationRequest:
      type: object
      required:
        - route_code
        - source
      properties:
        user_id:
          type: string
          example: "usr_a1b2c3d4e5f6"
        stop_id:
          type: string
          example: "030613"
        route_code:
          type: string
          example: "199"
        direction:
          type: string
          example: "IDA"
        observed_wait_min:
          type: number
          minimum: 0
          example: 14.5
        predicted_wait_min:
          type: number
          minimum: 0
          example: 12.0
        occupancy_est:
          type: integer
          minimum: 0
          maximum: 100
          example: 3
        source:
          type: string
          description: Procedência da observação (`passenger_checkin`, `Horário Programado · GTFS`, `avl_telemetry`).
          example: "passenger_checkin"

    DatabaseStatusAndTrainingResponse:
      type: object
      required:
        - available
        - storage
      properties:
        ok:
          type: boolean
          example: true
        available:
          type: boolean
