<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Slide CP-02 Tópicos Avançados</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .slide-container {
            width: 1280px;
            height: 720px;
            background-color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: flex;
            position: relative;
            box-sizing: border-box;
            padding: 60px;
        }
        .left-column {
            width: 55%;
            padding-right: 40px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }
        .right-column {
            width: 45%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }
        h1 {
            font-size: 42px;
            color: #333;
            font-weight: 300;
            margin-top: 0;
            margin-bottom: 50px;
            line-height: 1.2;
        }
        .info-block {
            margin-bottom: 30px;
            font-size: 24px;
            color: #222;
        }
        .info-block strong {
            font-weight: 700;
        }
        .link-block {
            margin-top: auto;
            font-size: 22px;
            word-wrap: break-word;
        }
        .link-block strong {
            font-weight: 700;
        }
        .link-block a {
            color: #0056b3;
            text-decoration: none;
            font-weight: 600;
        }
        .image-wrapper {
            width: 100%;
            height: 48%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #fff;
            box-sizing: border-box;
        }
        .image-wrapper img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border: 1px solid #ddd;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .logo-ufrpe {
            position: absolute;
            bottom: 20px;
            right: 20px;
            height: 60px;
        }
    </style>
</head>
<body>

<div class="slide-container">
    <div class="left-column">
        <h1>Cauã da Cunha Lira</h1>
        
        <div class="info-block">
            <strong>Modelo:</strong> RAPUNet-Zeta (CNN - Encoder ResNet50V2 + Decoder Spatial Attention + Mish)
        </div>
        
        <div class="info-block">
            <strong>Dataset:</strong> Kvasir-SEG (Pólipos Gastrointestinais, 1.000 imagens médicas)
        </div>
        
        <div class="info-block">
            <strong>Resultados:</strong> accuracy: 0.9627 - loss: 0.3416 - dice coef: 0.6536
        </div>
        
        <div class="link-block">
            <strong>Link:</strong><br>
            <a href="https://github.com/ccunhalira/topicos-avancados-ia-cp02" target="_blank">
                https://github.com/ccunhalira/topicos-avancados-ia-cp02
            </a>
        </div>
    </div>
    
    <div class="right-column">
        <div class="image-wrapper">
            <img src="plot_results/training_curves.png" alt="Training Curves">
        </div>
        <div class="image-wrapper">
            <img src="plot_results/segmentation_results.png" alt="Inference Results">
        </div>
    </div>
    
    <img class="logo-ufrpe" src="https://upload.wikimedia.org/wikipedia/commons/e/e0/Marca_da_Universidade_Federal_Rural_de_Pernambuco.png" alt="UFRPE Logo">
</div>

</body>
</html>
